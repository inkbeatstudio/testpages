<head>

<title>Anastasia Vasilyeva — Photographer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0c;
    --bg-2:#141414;
    --bg-3:#1b1b1b;
    --text:#e9e6e1;
    --muted:#9a9690;
    --line:rgba(233,230,225,.22);
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Montserrat', Arial, sans-serif;
    --pad:clamp(20px,6vw,64px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  img{display:block;width:100%;height:100%;object-fit:cover}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .container{max-width:1280px;margin:0 auto;padding:0 var(--pad)}
  .bw{filter:grayscale(1) contrast(1.05)}

  .caps{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:400}
  .h2{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(26px,3.2vw,38px);line-height:1.15}
  .link-line{display:inline-flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line);transition:border-color .3s, gap .3s}
  .link-line:hover{border-color:var(--text);gap:18px}
  .arrow{width:14px;height:8px}

  /* HEADER */
  header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .4s, padding .4s;padding:22px 0}
  header.scrolled{background:rgba(12,12,12,.92);backdrop-filter:blur(8px);padding:14px 0}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .logo{font-family:var(--serif);font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .menu{display:flex;gap:clamp(18px,2.4vw,34px);list-style:none}
  .menu a{position:relative}
  .menu a::after{content:"";position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--text);transition:width .3s}
  .menu a:hover::after{width:100%}
  .nav-right{display:flex;align-items:center;gap:22px}
  .lang{display:flex;gap:4px;align-items:center}
  .lang button{padding:4px 6px;opacity:.45;transition:opacity .3s}
  .lang button.active{opacity:1}
  .lang span{opacity:.3}
  .burger{width:22px;height:14px;position:relative}
  .burger i{position:absolute;left:0;right:0;height:1px;background:var(--text);transition:transform .3s, opacity .3s}
  .burger i:nth-child(1){top:0}.burger i:nth-child(2){top:6px}.burger i:nth-child(3){top:12px}
  body.menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  body.menu-open .burger i:nth-child(2){opacity:0}
  body.menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  .overlay{position:fixed;inset:0;z-index:40;background:rgba(10,10,10,.97);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;opacity:0;visibility:hidden;transition:opacity .4s, visibility .4s}
  body.menu-open .overlay{opacity:1;visibility:visible}
  .overlay a{font-family:var(--serif);font-size:30px;text-transform:uppercase;letter-spacing:.05em}
  .overlay .socials-m{display:flex;gap:28px;margin-top:20px}
  .overlay .socials-m a{font-family:var(--sans);font-size:11px;letter-spacing:.15em}

  /* HERO */
  .hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;overflow:hidden;background:#000}
  .hero-img{position:absolute;inset:0 0 0 30%}
  .hero-img img{object-position:center 20%;filter:grayscale(1) contrast(1.15) brightness(.75)}
  .hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 30%,rgba(0,0,0,0) 60%),linear-gradient(0deg,var(--bg) 0%,rgba(0,0,0,0) 25%)}
  .hero-content{position:relative;z-index:2;padding-top:80px}
  .hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,6.4vw,92px);line-height:1.02;letter-spacing:.03em;text-transform:uppercase}
  .hero .role{margin-top:26px}
  .vline{width:1px;height:70px;background:var(--line);margin:32px 0}
  .hero p{font-size:15px;max-width:260px;margin-bottom:40px}
  .side-socials{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
  .side-socials a{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;transition:opacity .3s}
  .side-socials a:hover{opacity:1}
  .side-socials i{width:1px;height:60px;background:var(--line)}

  /* SECTIONS */
  section{padding:clamp(64px,9vw,110px) 0}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:40px;flex-wrap:wrap}

  /* PORTFOLIO */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,24px)}
  .card{position:relative;aspect-ratio:3/3.9;overflow:hidden;background:var(--bg-3)}
  .card img{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
  .card:hover img{transform:scale(1.05)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 45%)}
  .card span{position:absolute;left:18px;bottom:18px;right:18px;z-index:2;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;line-height:1.4}

  /* ABOUT */
  .about{display:grid;grid-template-columns:1fr 1.6fr 1.6fr;gap:clamp(24px,4vw,60px);align-items:center}
  .about-meta{align-self:end;padding-bottom:20px}
  .about-meta .caps{display:block;line-height:1.8}
  .about-meta .sep{width:22px;height:1px;background:var(--line);margin:18px 0}
  .about-meta .vline{height:50px;margin:24px 0 0}
  .about-photo{aspect-ratio:4/4.3;overflow:hidden}
  .about-text p{color:#c9c5bf;max-width:380px;margin-top:22px}
  .about-text .link-line{margin-top:36px}

  /* SERVICES */
  .services{background:var(--bg-2)}
  .srv-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
  .srv{padding:32px 24px 32px 0;border-right:1px solid var(--line);margin-right:24px}
  .srv:last-child{border-right:0;margin-right:0}
  .srv h3{font-family:var(--serif);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
  .srv p{color:var(--muted);font-size:13px;margin:14px 0 22px}
  .srv .price{font-size:12px;letter-spacing:.1em;text-transform:uppercase}

  /* PROCESS */
  .process{background:var(--bg-3)}
  .process-wrap{display:grid;grid-template-columns:1fr 3fr;gap:40px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .step .num{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:22px;color:var(--muted);margin-bottom:12px}
  .step .num::after{content:"";flex:1;height:1px;background:var(--line)}
  .step:last-child .num::after{display:none}
  .step h4{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .step p{font-size:12px;color:var(--muted);line-height:1.6}

  /* REVIEWS */
  .rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,3vw,40px)}
  .rev{border-top:1px solid var(--line);padding-top:26px}
  .rev q{display:block;font-family:var(--serif);font-size:20px;line-height:1.45;font-style:italic;quotes:"«" "»"}
  .rev .who{margin-top:20px;color:var(--muted)}

  /* CTA */
  .cta{position:relative;overflow:hidden;background:#000;padding:clamp(80px,10vw,130px) 0}
  .cta-img{position:absolute;inset:0 0 0 40%}
  .cta-img img{object-position:center 30%;filter:grayscale(1) brightness(.55)}
  .cta-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,0) 55%)}
  .cta .container{position:relative;z-index:2}
  .cta h2{font-size:clamp(34px,4.6vw,60px);margin-bottom:40px}
  .btn{display:inline-flex;align-items:center;gap:40px;padding:18px 28px;border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s}
  .btn:hover{background:var(--text);color:#000;border-color:var(--text)}

  /* FOOTER */
  footer{padding:50px 0;border-top:1px solid rgba(255,255,255,.06)}
  .foot{display:grid;grid-template-columns:1.4fr 2fr 1fr auto;gap:30px;align-items:center}
  .foot-links{display:grid;grid-template-columns:repeat(3,auto);gap:10px 40px;justify-content:start}
  .foot-soc{display:flex;flex-direction:column;gap:10px}
  .foot a:not(.btn):hover{opacity:.6}
  .copy{margin-top:40px;color:var(--muted);font-size:11px}

  /* reveal */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease, transform 1s ease}
  .reveal.in{opacity:1;transform:none}

  /* RESPONSIVE */
  @media (max-width:1024px){
    .menu{display:none}
    .grid{grid-template-columns:repeat(2,1fr)}
    .srv-grid{grid-template-columns:repeat(2,1fr)}
    .srv:nth-child(2){border-right:0;margin-right:0}
    .srv:nth-child(n+3){border-top:1px solid var(--line)}
    .process-wrap{grid-template-columns:1fr}
    .foot{grid-template-columns:1fr 1fr}
  }
  @media (max-width:760px){
    .hero-img{inset:0}
    .hero-img::after{background:linear-gradient(0deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.2) 100%)}
    .hero{align-items:flex-end;padding-bottom:70px}
    .side-socials{display:none}
    .about{grid-template-columns:1fr}
    .about-meta{order:3;padding:0}
    .about-meta .vline{display:none}
    .steps{grid-template-columns:1fr 1fr;gap:32px 20px}
    .step .num::after{display:none}
    .srv-grid{grid-template-columns:1fr}
    .srv{border-right:0;margin-right:0;border-top:1px solid var(--line)}
    .srv:first-child{border-top:0}
    .rev-grid{grid-template-columns:1fr}
    .cta-img{inset:0}
    .cta-img::after{background:rgba(0,0,0,.55)}
    .foot{grid-template-columns:1fr}
    .foot-links{grid-template-columns:repeat(2,auto)}
    .logo{font-size:13px}
  }
</style>
</head>

function setLang(lang){
  if(!T[lang]) lang = "uk";
  document.documentElement.lang = lang === "uk" ? "uk" : "ru";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = T[lang][el.dataset.i18n];
    if(v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active", b.dataset.lang === lang));
  try{ localStorage.setItem("lang", lang); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(e){}
const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang || saved || "uk");

// Меню
const body = document.body;
document.getElementById("burger").addEventListener("click",()=>body.classList.toggle("menu-open"));
document.querySelectorAll("#overlay a[href^='#']").forEach(a=>a.addEventListener("click",()=>body.classList.remove("menu-open")));

// Хедер при скролі
const header = document.getElementById("header");
const onScroll = ()=>header.classList.toggle("scrolled", scrollY > 40);
addEventListener("scroll", onScroll, {passive:true}); onScroll();

// Поява блоків
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

// Запасні фото, якщо якесь не завантажилось
document.querySelectorAll("img[data-fallback]").forEach(img=>{
  img.addEventListener("error",()=>{ img.src = "https://picsum.photos/seed/" + img.dataset.fallback + "/1000/1300?grayscale"; },{once:true});
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>
